name: papersafe
description: "PaperSafe v2.0 – AI-Powered Secure Document Wallet"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI / Design
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  animate_do: ^3.3.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1

  # Networking
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Biometrics
  local_auth: ^2.3.0

  # OCR / ML Kit
  google_mlkit_text_recognition: ^0.13.0

  # AI (Gemini)
  google_generative_ai: ^0.4.6

  nearby_connections: ^4.3.0

  # QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Camera / Image
  image_picker: ^1.1.2
  camera: ^0.10.5+9

  # Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  workmanager: ^0.10.0

  # Search / Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Files & sharing
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  share_plus: ^8.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.0

  # PDF
  syncfusion_flutter_pdfviewer: ^27.1.0

  # Misc
  archive: ^3.6.1
  pinput: ^5.0.0
  intl: ^0.19.0
  carousel_slider: ^5.0.0
  calendar_date_picker2: ^1.0.3
  country_picker: ^2.0.26
  flutter_otp_text_field: ^1.1.3+2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/indian_flag.png
    - assets/images/login_svg.svg
    - assets/PaperSafeLogos/fill_inside_logo.png
    - assets/images/Student.svg
    - assets/images/Other.svg
    - assets/images/Professional.svg
    - assets/images/aadhar_logo.png
    - assets/images/article_logo.png
    - assets/images/backup_logo.png
    - assets/images/credit_card_logo.png
    - assets/images/marksheet.png
    - assets/images/id_card_logo.png
    - assets/images/qr_code_logo.png
    - assets/images/aadhar_card_dummy.png
    - assets/images/aadhar_dummy_svg.svg
    - assets/images/copy-icon.svg
    - assets/images/Copy-24.png
    - assets/PaperSafeLogos/dark_outline_logo.png
    - assets/PaperSafeLogos/light_outline_logo.png
    - assets/images/pan_card_frame.svg
    - assets/images/train_ticket.png
    - assets/images/movie_ticket.png
    - assets/PaperSafeLogos/paper_safe_gradient.png
    - assets/PaperSafeLogos/paper_safe_same_gradient.png
    - assets/images/backup_logo.svg
    - assets/images/credit_card_logo.svg
    - assets/images/marksheet.svg
    - assets/images/id_card_logo.svg
    - assets/images/qr_code_logo.svg
